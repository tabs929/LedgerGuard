services:
  postgres:
    image: 'postgres:16.4'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-ledgerguard}'
      - 'POSTGRES_USER=${POSTGRES_USER:-ledgerguard}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see .env.example}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ledgerguard-postgres-data:/var/lib/postgresql/data

  # Task 12: a single-node KRaft broker (no ZooKeeper) for local outbox
  # publishing. The application runs on the host (`./mvnw spring-boot:run`,
  # not inside this Compose network), so the only listener that matters is
  # the host-facing one advertised as localhost:${KAFKA_PORT:-9092} -- the
  # same host:port the app's default spring.kafka.bootstrap-servers points
  # at (see src/main/resources/application.yml).
  kafka:
    image: 'apache/kafka:3.9.0'
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - 'KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093'
      - 'KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:${KAFKA_PORT:-9092}'
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ledgerguard-postgres-data:
