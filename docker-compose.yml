services:
  postgres:
    image: 'postgres:16.4'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-ledgerguard}'
      - 'POSTGRES_USER=${POSTGRES_USER:-ledgerguard}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set, see .env.example}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - ledgerguard-postgres-data:/var/lib/postgresql/data

volumes:
  ledgerguard-postgres-data:
