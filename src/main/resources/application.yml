spring:
  application:
    name: ledgerguard
  jpa:
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # Task 14: outer request-level boundary only. The actual enforced
      # settlement-import limit is the smaller, independently configurable
      # ledgerguard.settlement.import.max-file-size-bytes below, checked
      # again inside SettlementImportService regardless of this value.
      max-file-size: 6MB
      max-request-size: 7MB
  kafka:
    # Overridable via the KAFKA_BOOTSTRAP_SERVERS environment variable in
    # any environment where localhost:9092 (the local Compose broker,
    # see docker-compose.yml) is not correct -- never hardcoded elsewhere.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Durable acknowledgement (Task 12): the broker only acks after the
      # record is written to every in-sync replica. Producer idempotence
      # suppresses duplicate broker-retry sends within one producer
      # session -- it does not close the PostgreSQL/Kafka crash window
      # documented in docs/ARCHITECTURE.md's "Kafka Publishing" section,
      # and it is not end-to-end exactly-once delivery.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      # String deserialization (Task 13) -- mirrors the producer's String
      # serialization. enable-auto-commit is force-overridden to false in
      # inbox.LedgerEventConsumerConfig regardless of this value, since
      # manual acknowledgement is mandatory for the commit-before-ack
      # ordering this task requires.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false

springdoc:
  # Every endpoint in this application only ever produces application/json;
  # without this, springdoc documents responses as the generic "*/*"
  # wildcard instead of the actual, single content type the app returns.
  default-produces-media-type: application/json

ledgerguard:
  outbox:
    publisher:
      # Every PostgreSQL-only integration test overrides this to false via
      # application-test.yml, specifically so it never attempts a Kafka
      # connection. True here is the normal application default.
      enabled: true
      topic: ${LEDGER_EVENTS_TOPIC:ledger.transaction-events.v1}
      partitions: 3
      # Local/Testcontainers default only -- production should normally
      # use a replication factor greater than 1.
      replication-factor: 1
      poll-delay-millis: 2000
      batch-size: 20
      send-timeout-millis: 5000
  inbox:
    consumer:
      # Every PostgreSQL-only integration test overrides this to false via
      # application-test.yml, specifically so it never attempts a Kafka
      # connection. True here is the normal application default.
      enabled: true
      topic: ${LEDGER_EVENTS_TOPIC:ledger.transaction-events.v1}
      group-id: ${LEDGER_EVENTS_CONSUMER_GROUP_ID:ledgerguard-transaction-event-consumer-v1}
      # No greater than the outbox publisher's default partition count
      # above, so every partition can have an active consumer thread.
      concurrency: 3
      # Deterministic for local/test use -- a fresh consumer group reads
      # every retained record from the beginning of the topic rather than
      # only new ones.
      auto-offset-reset: earliest
      poll-timeout-millis: 5000
  settlement:
    import:
      enabled: true
      max-file-size-bytes: 5242880
      max-row-count: 10000
      max-source-length: 64
      max-external-reference-length: 128
